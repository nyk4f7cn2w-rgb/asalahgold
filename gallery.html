<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>معرض أصالة الذهب | ASALAH GOLD Gallery</title><style>:root{--bg:#080808;--gold:#d3aa4c;--gold2:#f0d68b;--cream:#f4efe5;--muted:#aaa49a;--line:rgba(211,170,76,.28)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}header{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}.nav{height:82px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}.brand b{font-size:13px}.brand small{display:block;color:var(--gold);letter-spacing:2px;font-size:8px}.home,.lang{border:1px solid var(--line);background:none;color:var(--gold2);padding:10px 14px;text-decoration:none;font-size:11px}.actions{display:flex;gap:8px}.hero{padding:90px 0 55px;text-align:center}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:4px}.hero h1{font-size:clamp(38px,7vw,72px);margin:12px 0 18px}.hero p{max-width:650px;margin:auto;color:var(--muted);line-height:2;font-size:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding-bottom:100px}.item{position:relative;overflow:hidden;border:1px solid var(--line);background:#0d0d0c;min-height:300px}.item img{width:100%;height:100%;object-fit:cover;transition:transform .55s ease}.item:hover img{transform:scale(1.025)}.item:after{content:"ASALAH GOLD";position:absolute;bottom:12px;right:12px;background:rgba(8,8,8,.72);border:1px solid var(--line);padding:7px 10px;color:var(--gold2);font-size:8px;letter-spacing:2px}.wide{grid-column:span 7;aspect-ratio:16/10}.side{grid-column:span 5;aspect-ratio:4/5}.half{grid-column:span 6;aspect-ratio:4/3}.third{grid-column:span 4;aspect-ratio:4/5}footer{border-top:1px solid rgba(255,255,255,.08);padding:28px 0;text-align:center;color:var(--muted);font-size:10px}@media(max-width:700px){.nav{height:72px}.brand b{font-size:11px}.home{padding:9px}.hero{padding:60px 0 35px}.grid{grid-template-columns:1fr;gap:12px}.item,.wide,.side,.half,.third{grid-column:auto;aspect-ratio:auto;min-height:0}.item img{height:auto;max-height:none;object-fit:contain}.item:after{bottom:8px;right:8px}.hero p{font-size:13px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="logo.jpg" alt="ASALAH GOLD"><span><b id="brand">أصالة الذهب</b><small>ASALAH GOLD</small></span></a><div class="actions"><button class="lang" onclick="toggleLang()" id="lang">English</button><a class="home" href="index.html" id="home">الرئيسية</a></div></div></header><main><section class="hero wrap"><div class="eyebrow">ASALAH GOLD • OFFICIAL GALLERY</div><h1 id="title">معرض أصالة الذهب</h1><p id="intro">لمحات من معروضات ومجوهرات أصالة الذهب، وصور من داخل واجهة ومعرض الشركة في الصويرة.</p></section><section class="grid wrap"><figure class="item side"><img src="gallery/IMG_2633.jpeg" loading="eager" alt="ASALAH GOLD gallery 1"></figure><figure class="item wide"><img src="gallery/IMG_2634.jpeg" loading="lazy" alt="ASALAH GOLD gallery 2"></figure><figure class="item half"><img src="gallery/IMG_2635.jpeg" loading="lazy" alt="ASALAH GOLD gallery 3"></figure><figure class="item half"><img src="gallery/IMG_2639.jpeg" loading="lazy" alt="ASALAH GOLD gallery 4"></figure><figure class="item third"><img src="gallery/IMG_2640.jpeg" loading="lazy" alt="ASALAH GOLD gallery 5"></figure><figure class="item third"><img src="gallery/IMG_2641.jpeg" loading="lazy" alt="ASALAH GOLD gallery 6"></figure><figure class="item third"><img src="gallery/IMG_2643.jpeg" loading="lazy" alt="ASALAH GOLD gallery 7"></figure><figure class="item wide"><img src="gallery/IMG_2646.jpeg" loading="lazy" alt="ASALAH GOLD gallery 8"></figure><figure class="item side"><img src="gallery/IMG_2647.jpeg" loading="lazy" alt="ASALAH GOLD gallery 9"></figure><figure class="item half"><img src="gallery/IMG_2648.jpeg" loading="lazy" alt="ASALAH GOLD gallery 10"></figure></section></main><footer><div class="wrap">© <span id="year"></span> ASALAH GOLD</div></footer><script>let en=false;function toggleLang(){en=!en;document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';document.getElementById('brand').textContent=en?'ASALAH GOLD':'أصالة الذهب';document.getElementById('title').textContent=en?'ASALAH GOLD Gallery':'معرض أصالة الذهب';document.getElementById('intro').textContent=en?'A curated view of ASALAH GOLD jewelry displays and our showroom in Al-Suwaira.':'لمحات من معروضات ومجوهرات أصالة الذهب، وصور من داخل واجهة ومعرض الشركة في الصويرة.';document.getElementById('home').textContent=en?'Home':'الرئيسية';document.getElementById('lang').textContent=en?'العربية':'English'}document.getElementById('year').textContent=new Date().getFullYear();</script></body></html>
